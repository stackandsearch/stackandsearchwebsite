# Netlify build settings. This file overrides the settings in the Netlify UI.
[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime: turns the Next.js build into real pages and
# server functions (lead forms, 404 page, images).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# blog.stackandsearch.com -> the blog on the main site (same path).
[[redirects]]
  from = "https://blog.stackandsearch.com/*"
  to = "https://stackandsearch.com/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://blog.stackandsearch.com/*"
  to = "https://stackandsearch.com/blog/:splat"
  status = 301
  force = true

# The Netlify address -> the real domain, so search engines see one copy.
[[redirects]]
  from = "https://stackandsearch.netlify.app/*"
  to = "https://stackandsearch.com/:splat"
  status = 301
  force = true
